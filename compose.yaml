services:
  api:
    build: .
    image: ${IMAGE_REF:-container-hardening-lab:local}
    user: "10001:10001"
    labels:
      security.lab: container-hardening
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    read_only: true
    # Espace temporaire necessaire a Gunicorn.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777

    cpus: 0.5
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=2) as response:
              healthy = response.status == 200 and json.load(response) == {"status": "ok"}
          raise SystemExit(0 if healthy else 1)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  falco:
    profiles: [runtime]
    image: falcosecurity/falco:0.45.1@sha256:69e957f91b3a6beb5c82e2afae33ec3e4479dab2d4421475d288d0cd113cedf6
    command: >
      /usr/bin/falco -r /etc/falco/falco_rules.local.yaml
      -o engine.kind=modern_ebpf -o json_output=true
      -o buffered_outputs=false -o log_syslog=false
      -o syslog_output.enabled=false
    cap_drop: [ALL]
    cap_add: [BPF, PERFMON, SYS_RESOURCE, SYS_PTRACE]
    read_only: true
    network_mode: none
    mem_limit: 512m
    pids_limit: 128
    volumes:
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
      - ./falco_rules.local.yaml:/etc/falco/falco_rules.local.yaml:ro
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8765/healthz]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  simulation:
    profiles: [runtime]
    image: ${IMAGE_REF:-container-hardening-lab:local}
    user: "0:0"
    init: true
    entrypoint: [sleep, infinity]
    labels:
      security.lab: container-hardening
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    mem_limit: 64m
    pids_limit: 16
