- rule: Lab Shell
  desc: Detecte un shell execute dans un conteneur du laboratoire.
  condition: >
    evt.type in (execve, execveat)
    and evt.rawres >= 0
    and container.id != host
    and container.label[security.lab] = "container-hardening"
    and proc.name in (sh, ash, bash, dash, csh, ksh, tcsh, zsh)
  output: >
    Shell opened in lab container (container=%container.name id=%container.id
    user=%user.uid process=%proc.name command=%proc.cmdline result=%evt.res)
  priority: WARNING
  source: syscall
  tags: [lab, container, shell]

- rule: Lab Sensitive Write
  desc: Detecte une ouverture en ecriture du fichier sensible factice.
  condition: >
    evt.type in (open, openat, openat2)
    and evt.is_open_write = true
    and fd.num >= 0
    and container.id != host
    and container.label[security.lab] = "container-hardening"
    and fd.name = "/etc/lab-sensitive.conf"
  output: >
    Sensitive lab file opened for writing (container=%container.name id=%container.id
    user=%user.uid process=%proc.name command=%proc.cmdline file=%fd.name result=%evt.res)
  priority: ERROR
  source: syscall
  tags: [lab, container, filesystem]
